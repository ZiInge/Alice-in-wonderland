# Alice Controller
# v1.5.0-c2
#
# Board: ESP32-S3 DevKitC-1 (Espressif)
# Actuator: Actuonix L12-100-210-12-I
#
# v1.5.0-c2:
# - Target position control
# - +/-5% position deadband
# - 200 ms neutral transition when reversing direction
# - 500 ms startup boost at end stops
# - Motion state: Idle / Opening / Closing / Fault
# - No-movement detection
# - 30 second overall motion timeout
# - Fault flag
# - Hold current position on fault
# - Manual Extend/Retract retained

esphome:
  name: alice-controller
  friendly_name: Alice Controller

  on_boot:
    priority: -100
    then:
      - delay: 2s
      - lambda: |-
          id(alice_motion_enabled) = true;
          id(alice_motion_fault) = false;
      - text_sensor.template.publish:
          id: alice_motion_state
          state: "Idle"
      - logger.log: "Alice motion control enabled"

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "UnyasmMQk930Ns2TDreUFXBgnlBSiE9khM5BhTUAa4I="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Alice Controlle Fallback Hotspot
    password: "P4iEhfRQ8a2f"

captive_portal:

globals:
  - id: alice_motion_enabled
    type: bool
    restore_value: no
    initial_value: "false"

  - id: alice_last_servo_level
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: alice_target_servo_level
    type: float
    restore_value: no
    initial_value: "0.0"

  # Position deadband.
  # 5% means:
  # target 50% = acceptable range 45-55%.
  - id: alice_position_tolerance
    type: float
    restore_value: no
    initial_value: "5.0"

  # Fault flag.
  - id: alice_motion_fault
    type: bool
    restore_value: no
    initial_value: "false"

  # Position when active movement monitoring begins.
  - id: alice_motion_start_position
    type: float
    restore_value: no
    initial_value: "0.0"

sensor:
  - platform: wifi_signal
    name: "Alice WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Alice Uptime"

  - platform: adc
    pin: GPIO5
    name: "Alice Actuator Feedback Voltage"
    id: alice_actuator_feedback_voltage
    attenuation: 12db
    update_interval: 500ms

  - platform: template
    name: "Alice Door Position"
    id: alice_door_position
    icon: mdi:garage
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 500ms
    lambda: |-
      float voltage = id(alice_actuator_feedback_voltage).state;

      // Calibrated range
      if (voltage < 0.09f) voltage = 0.09f;
      if (voltage > 3.15f) voltage = 3.15f;

      // Retracted = 0%
      // Extended = 100%
      float position =
          (3.15f - voltage) / (3.15f - 0.09f);

      // Final safety clamp
      if (position < 0.0f) position = 0.0f;
      if (position > 1.0f) position = 1.0f;

      return position * 100.0f;

text_sensor:
  - platform: version
    name: "Alice Firmware"

  - platform: wifi_info
    ip_address:
      name: "Alice IP Address"
    ssid:
      name: "Alice Connected WiFi"

  - platform: template
    name: "Alice Motion State"
    id: alice_motion_state
    icon: mdi:motion-sensor

binary_sensor:
  - platform: template
    name: "Alice Motion Fault"
    id: alice_motion_fault_sensor
    device_class: problem
    lambda: |-
      return id(alice_motion_fault);

script:

  # ------------------------------------------------------------
  # HOLD CURRENT POSITION
  # ------------------------------------------------------------

  - id: alice_hold_current_position
    mode: restart

    then:
      - lambda: |-
          float position = id(alice_door_position).state;

          // Convert current position into actuator command.
          float hold_level =
              (position / 50.0f) - 1.0f;

          if (hold_level < -1.0f) {
            hold_level = -1.0f;
          }

          if (hold_level > 1.0f) {
            hold_level = 1.0f;
          }

          id(alice_servo).write(hold_level);
          id(alice_last_servo_level) = hold_level;

          ESP_LOGD(
            "main",
            "Holding current position %.0f%% (servo %.3f)",
            position,
            hold_level
          );

  # ------------------------------------------------------------
  # FAULT HANDLER
  # ------------------------------------------------------------

  - id: alice_motion_fault_handler
    mode: restart

    parameters:
      reason: std::string

    then:
      - lambda: |-
          id(alice_motion_fault) = true;

      - text_sensor.template.publish:
          id: alice_motion_state
          state: "Fault"

      - logger.log:
          format: "MOTION FAULT: %s"
          args:
            - reason.c_str()

      # Do NOT send neutral.
      # Neutral would command the actuator toward the middle.
      - script.execute: alice_hold_current_position

  # ------------------------------------------------------------
  # MOVE TO TARGET
  # ------------------------------------------------------------

  - id: alice_move_to_target
    mode: restart

    parameters:
      target_position: float

    then:
      - lambda: |-
          // Clear any previous fault before a new command.
          id(alice_motion_fault) = false;

          id(alice_motion_start_position) =
              id(alice_door_position).state;

      - text_sensor.template.publish:
          id: alice_motion_state
          state: "Idle"

      - logger.log:
          format: "Target position: %.0f%%"
          args:
            - target_position

      # Calculate actuator position command.
      - lambda: |-
          float target_level =
              (target_position / 50.0f) - 1.0f;

          if (target_level < -1.0f) {
            target_level = -1.0f;
          }

          if (target_level > 1.0f) {
            target_level = 1.0f;
          }

          id(alice_target_servo_level) =
              target_level;

      # Determine direction.
      - if:
          condition:
            lambda: |-
              return id(alice_door_position).state <
                     (target_position -
                      id(alice_position_tolerance));

          then:
            - text_sensor.template.publish:
                id: alice_motion_state
                state: "Opening"

          else:
            - if:
                condition:
                  lambda: |-
                    return id(alice_door_position).state >
                           (target_position +
                            id(alice_position_tolerance));

                then:
                  - text_sensor.template.publish:
                      id: alice_motion_state
                      state: "Closing"

                else:
                  - text_sensor.template.publish:
                      id: alice_motion_state
                      state: "Idle"

      # Already at target?
      - if:
          condition:
            lambda: |-
              const float error =
                  id(alice_door_position).state -
                  target_position;

              const float tolerance =
                  id(alice_position_tolerance);

              return
                error >= -tolerance &&
                error <= tolerance;

          then:
            - logger.log: "Already within target deadband"

          else:

            # Direction reversal protection.
            - if:
                condition:
                  lambda: |-
                    const float last_level =
                        id(alice_last_servo_level);

                    const float target_level =
                        id(alice_target_servo_level);

                    return
                      (last_level > 0.01f &&
                       target_level < -0.01f) ||
                      (last_level < -0.01f &&
                       target_level > 0.01f);

                then:
                  - logger.log:
                      "Direction change - sending neutral"

                  - servo.write:
                      id: alice_servo
                      level: 7.5%

                  - delay: 200ms

            # Startup boost from fully retracted.
            - if:
                condition:
                  lambda: |-
                    return
                      id(alice_door_position).state <= 2.0f &&
                      id(alice_target_servo_level) > 0.01f;

                then:
                  - logger.log:
                      "Startup boost: EXTEND"

                  - servo.write:
                      id: alice_servo
                      level: 97%

                  - delay: 500ms

            # Startup boost from fully extended.
            - if:
                condition:
                  lambda: |-
                    return
                      id(alice_door_position).state >= 98.0f &&
                      id(alice_target_servo_level) < -0.01f;

                then:
                  - logger.log:
                      "Startup boost: RETRACT"

                  - servo.write:
                      id: alice_servo
                      level: -97%

                  - delay: 500ms

            # Send target position command.
            - lambda: |-
                id(alice_servo).write(
                    id(alice_target_servo_level)
                );

                id(alice_last_servo_level) =
                    id(alice_target_servo_level);

                ESP_LOGD(
                  "main",
                  "Servo target level: %.3f",
                  id(alice_target_servo_level)
                );

            # ------------------------------------------------
            # NO-MOVEMENT CHECK
            # ------------------------------------------------

            # Give the actuator time to begin moving.
            - delay: 2500ms

            - if:
                condition:
                  lambda: |-
                    const float current =
                        id(alice_door_position).state;

                    const float start =
                        id(alice_motion_start_position);

                    return fabsf(current - start) < 1.0f;

                then:
                  - script.execute:
                      id: alice_motion_fault_handler
                      reason: "No position change detected"
                  - script.stop: alice_move_to_target

            # ------------------------------------------------
            # TARGET / TIMEOUT CHECK
            # ------------------------------------------------

            - wait_until:
                condition:
                  lambda: |-
                    const float error =
                        id(alice_door_position).state -
                        target_position;

                    const float tolerance =
                        id(alice_position_tolerance);

                    return
                      error >= -tolerance &&
                      error <= tolerance;

                timeout: 30s

            - if:
                condition:
                  lambda: |-
                    const float error =
                        id(alice_door_position).state -
                        target_position;

                    const float tolerance =
                        id(alice_position_tolerance);

                    return
                      error >= -tolerance &&
                      error <= tolerance;

                then:
                  - text_sensor.template.publish:
                      id: alice_motion_state
                      state: "Idle"

                  - logger.log:
                      format: "Target position %.0f%% reached"
                      args:
                        - target_position

                else:
                  - script.execute:
                      id: alice_motion_fault_handler
                      reason: "30 second movement timeout"

number:
  - platform: template
    name: "Alice Target Position"
    id: alice_target_position
    icon: mdi:target
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    restore_value: false
    initial_value: 0

    on_value:
      then:
        - if:
            condition:
              lambda: |-
                return id(alice_motion_enabled);

            then:
              - script.execute:
                  id: alice_move_to_target
                  target_position: !lambda "return x;"

button:
  - platform: restart
    name: "Alice Restart Controller"

  # Manual Retract
  - platform: template
    name: "Alice Actuator Retract"
    on_press:
      then:
        - script.stop: alice_move_to_target
        - script.stop: alice_motion_fault_handler

        - lambda: |-
            id(alice_motion_fault) = false;

        - text_sensor.template.publish:
            id: alice_motion_state
            state: "Closing"

        - if:
            condition:
              lambda: |-
                return id(alice_last_servo_level) > 0.01f;

            then:
              - servo.write:
                  id: alice_servo
                  level: 7.5%

              - delay: 200ms

        - servo.write:
            id: alice_servo
            level: -97%

        - lambda: |-
            id(alice_last_servo_level) = -0.97f;

        # Wait until fully retracted
        - wait_until:
            condition:
              lambda: |-
                return id(alice_door_position).state <=
                       id(alice_position_tolerance);

            timeout: 30s

        - if:
            condition:
              lambda: |-
                return id(alice_door_position).state <=
                       id(alice_position_tolerance);

            then:
              - text_sensor.template.publish:
                  id: alice_motion_state
                  state: "Idle"

              - logger.log:
                  "Manual retract completed"

            else:
              - script.execute:
                  id: alice_motion_fault_handler
                  reason: "Manual retract timeout"


  # Manual Extend
  - platform: template
    name: "Alice Actuator Extend"
    on_press:
      then:
        - script.stop: alice_move_to_target
        - script.stop: alice_motion_fault_handler

        - lambda: |-
            id(alice_motion_fault) = false;

        - text_sensor.template.publish:
            id: alice_motion_state
            state: "Opening"

        - if:
            condition:
              lambda: |-
                return id(alice_last_servo_level) < -0.01f;

            then:
              - servo.write:
                  id: alice_servo
                  level: 7.5%

              - delay: 200ms

        - servo.write:
            id: alice_servo
            level: 97%

        - lambda: |-
            id(alice_last_servo_level) = 0.97f;

        # Wait until fully extended
        - wait_until:
            condition:
              lambda: |-
                return id(alice_door_position).state >=
                       (100.0f - id(alice_position_tolerance));

            timeout: 30s

        - if:
            condition:
              lambda: |-
                return id(alice_door_position).state >=
                       (100.0f - id(alice_position_tolerance));

            then:
              - text_sensor.template.publish:
                  id: alice_motion_state
                  state: "Idle"

              - logger.log:
                  "Manual extend completed"

            else:
              - script.execute:
                  id: alice_motion_fault_handler
                  reason: "Manual extend timeout"

output:
  - platform: ledc
    pin: GPIO18
    id: alice_pwm_output
    frequency: 50Hz

servo:
  - id: alice_servo
    output: alice_pwm_output
    min_level: 5%
    idle_level: 7.5%
    max_level: 10%